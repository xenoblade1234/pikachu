<title>Personal Debate Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed study-desk sidebar (navigation, storage status) + scrolling reading column; detail and editors open in a right-hand drawer. Dark-only by design. */
:root{
  --bg:#12151b; --panel:#181c24; --panel-2:#1e232d; --line:#2a303b; --line-2:#3a4150;
  --ink:#e9e4d8; --ink-2:#c4c0b5; --muted:#8f95a2; --faint:#646b78;
  --brass:#c9a55e; --brass-ink:#17120a; --brass-soft:rgba(201,165,94,.13);
  --pro:#82b5a9; --pro-soft:rgba(130,181,169,.14); --contra:#d4846f; --contra-soft:rgba(212,132,111,.14);
  --warn:#d9a648; --good:#93c08b; --bad:#d4846f;
  --s1:#c9a55e; --s2:#82b5a9; --s3:#d4846f; --s4:#a39fd8; --s5:#6fa6d2; --s6:#a9bd6f; --s7:#d7a0c0;
  --f-display:'Newsreader', 'Iowan Old Style', Georgia, serif;
  --f-ui:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px;overflow-y:auto}
.brand{padding:0 8px}
.brand .eyebrow{font-size:10px}
.brand h1{font-size:25px;font-style:italic;margin-top:4px;color:var(--ink)}
.brand h1 b{font-style:normal;font-weight:500;color:var(--brass)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:var(--r);padding:8px 10px;text-align:left;color:var(--ink-2);cursor:pointer}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button.on{background:var(--brass-soft);color:var(--ink)}
.nav button.on .lbl{color:var(--brass)}
.nav .cnt{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.search-box{padding:0 2px}
.search-box input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:13px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px;font-size:12px}
.status{display:flex;gap:8px;align-items:flex-start;color:var(--muted);line-height:1.4}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-top:5px;flex:none}
.status.ok i{background:var(--good)} .status.loc i{background:var(--warn)}
.foot-btns{display:flex;gap:6px;flex-wrap:wrap}

main{min-width:0;padding-block:28px 80px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.head h2{font-size:34px;line-height:1.1}
.head p{color:var(--muted);max-width:62ch;margin-top:6px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-size:13.5px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)} .btn.danger[data-armed]{background:var(--contra-soft);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{border:1px solid var(--line);background:none;border-radius:4px;padding:2px 8px;font-size:12px;color:var(--muted);cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--brass)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:13.5px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brass-soft);color:var(--brass)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink-2);background:none;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--brass)}
.chip.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.chip.pro{color:var(--pro);border-color:color-mix(in srgb,var(--pro) 45%,transparent);background:var(--pro-soft)}
.chip.contra{color:var(--contra);border-color:color-mix(in srgb,var(--contra) 45%,transparent);background:var(--contra-soft)}
.chip.ex{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);border-style:dashed}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel-h h3{font-size:19px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:2px;cursor:pointer;border:0;text-align:left;color:inherit}
.stat:hover{background:var(--panel-2)}
.stat .n{font-family:var(--f-display);font-size:38px;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.stat .sub{font-size:12px;color:var(--faint)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink-2)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.empty b{color:var(--ink-2);font-weight:500}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;width:100%}
.row:first-child{border-top:0}
.row:hover .t{color:var(--brass)}
.row .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.row .t{font-family:var(--f-display);font-size:17px;line-height:1.3;min-width:0}
.row .m{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .s{grid-column:2 / -1;font-size:13px;color:var(--muted);margin-top:-4px}
.group-h{margin-top:14px;padding:6px 4px;border-bottom:1px solid var(--line-2)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:inherit;min-width:0}
.card:hover{border-color:var(--line-2);background:var(--panel-2)}
.card h4{font-size:17px;line-height:1.3}
.card p{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:auto;font-size:12px;color:var(--faint)}
.dots{letter-spacing:2px;color:var(--brass);font-size:11px}
.dots .off{color:var(--line-2)}

/* checklist */
.check{display:flex;flex-direction:column}
.check-i{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 2px;border-top:1px solid var(--line)}
.check-i:first-child{border-top:0}
.check-i input{margin-top:4px;accent-color:var(--brass)}
.check-i.done .tx{color:var(--faint);text-decoration:line-through}
.check-i .meta{font-size:11.5px;color:var(--faint)}
.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.x:hover{color:var(--bad)}
.inline-add{display:flex;gap:6px;flex-wrap:wrap}
.inline-add input,.inline-add select{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:13px}
.inline-add input[type=text]{flex:1 1 160px;min-width:0}

/* weaknesses */
.weak{display:flex;flex-direction:column;gap:6px}
.weak-i{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.weak-i .bar{align-self:stretch;border-radius:2px;background:var(--warn)}
.weak-i.hi .bar{background:var(--bad)}
.weak-i.lo .bar{background:var(--faint)}
.weak-i .meta{font-size:12px;color:var(--muted)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(6,8,12,.62)}
.sheet-panel{position:relative;width:min(760px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line-2);overflow-y:auto;padding-block:max(22px, env(safe-area-inset-top,0px)) max(40px, env(safe-area-inset-bottom,0px));padding-left:28px;padding-right:max(28px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet-top h2{font-size:28px;line-height:1.2}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h5{margin:0;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.prose{color:var(--ink-2);max-width:68ch;display:flex;flex-direction:column;gap:6px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.prose h4{font-size:16px;color:var(--ink);margin-top:4px}
.prose strong{color:var(--ink);font-weight:600}
.meta-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.missing{font-size:12.5px;color:var(--faint)}
.linked{display:flex;flex-direction:column;gap:6px}
.linked button{display:flex;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;cursor:pointer;text-align:left;color:inherit}
.linked button:hover{border-color:var(--brass)}
.linked .lt{font-family:var(--f-display);font-size:15.5px}
.linked .ls{font-size:12.5px;color:var(--muted);margin-top:2px}
.notes-log{display:flex;flex-direction:column;gap:8px}
.note{border-left:2px solid var(--line-2);padding:2px 0 2px 12px}
.note .when{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.add-note{display:flex;gap:8px;align-items:flex-end}
.add-note textarea{flex:1;min-width:0}
.ratings-view{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 28px;gap:6px 12px;align-items:center;font-size:13px}
.rbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--brass)}

/* forms */
form.ed{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lab{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.fld .hint{font-size:11.5px;color:var(--faint)}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea,.add-note textarea,.composer textarea,.kb-add textarea,.kb-add input{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
.fld textarea,.add-note textarea{resize:vertical;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brass);outline:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-40px;background:var(--panel);padding:12px 0;border-top:1px solid var(--line)}
.picker{border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.picker input{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:13px}
.picker button{background:none;border:0;text-align:left;padding:6px 6px;border-radius:4px;cursor:pointer;color:var(--ink-2);font-size:13px}
.picker button:hover{background:var(--panel-2);color:var(--ink)}
.linklist{border:1px solid var(--line);border-radius:var(--r);max-height:200px;overflow-y:auto;padding:6px 8px;background:var(--bg)}
.linklist label{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px;color:var(--ink-2);cursor:pointer}
.linklist input{accent-color:var(--brass)}
.sliders{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.slider{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.slider input{accent-color:var(--brass);width:100%}
.slider output{font-family:var(--f-mono);text-align:right;color:var(--brass)}

/* ---------- trainer ---------- */
.trainer{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1.3}
.mode:hover{border-color:var(--line-2)}
.mode.on{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.motion-card{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.motion-card .mt{font-family:var(--f-display);font-size:18px;line-height:1.3}
.timer{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.clock{font-family:var(--f-mono);font-size:40px;letter-spacing:.02em;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.clock.warn{color:var(--warn)} .clock.over{color:var(--bad)}
.clock-sub{text-align:center;font-size:12px;color:var(--muted);min-height:18px}
.tbar{height:4px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--brass)}
.chat{display:flex;flex-direction:column;gap:12px;min-height:360px}
.msg{max-width:92%;border-radius:8px;padding:11px 14px;font-size:14px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--panel-2);border:1px solid var(--line-2);white-space:pre-wrap}
.msg.ai{align-self:flex-start;border-left:2px solid var(--brass);background:var(--bg);border-radius:0 8px 8px 0}
.msg.sys{align-self:center;font-size:12.5px;color:var(--muted);background:none;text-align:center;padding:4px 10px;border:1px dashed var(--line);border-radius:999px}
.msg .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.msg.ai .prose{color:var(--ink)}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.composer textarea{min-height:110px;resize:vertical}
.composer .row-b{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.fb{border:1px solid var(--brass);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--brass-soft)}
.fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

/* ---------- progress ---------- */
.chart-wrap{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:520px}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.num{font-family:var(--f-mono);text-align:right}
.tbl th.num{text-align:right}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--warn);border-radius:4px}
.hbar .track i.hi{background:var(--bad)}

/* ---------- knowledge ---------- */
.kb{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px}
.toc button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:var(--r);color:var(--muted);cursor:pointer;font-size:13.5px}
.toc button:hover{color:var(--ink)}
.toc button.on{color:var(--brass);background:var(--brass-soft)}
.kb-body{display:flex;flex-direction:column;gap:18px;min-width:0}
.kb-block{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.kb-block h4{font-size:20px}
.kb-block .prose{font-size:14.5px}
.kb-block dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.kb-block dt{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.kb-block dd{margin:2px 0 0;color:var(--ink-2)}
.kb-block dd em{color:var(--muted);font-style:normal}
.kb-block dd .ctr{color:var(--pro)}
.kb-own{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.kb-add{display:flex;flex-direction:column;gap:6px}
.timeline-tbl td:first-child{white-space:nowrap}

/* ---------- toast ---------- */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const dayOf = iso => iso ? String(iso).slice(0,10) : '';
function fmtDate(d){ if(!d) return 'ohne Datum'; const x = new Date(d+'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('de-AT',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtShort(d){ if(!d) return '—'; const x = new Date(d+'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
const clip = (s,n) => { s = String(s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const byDateDesc = (a,b) => (b.date||dayOf(b.createdAt)).localeCompare(a.date||dayOf(a.createdAt));
const byUpdated = (a,b) => String(b.updatedAt||'').localeCompare(String(a.updatedAt||''));
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const fmt1 = n => n==null ? '—' : n.toFixed(1).replace('.',',');
function md(t){
  const lines = esc(t).split('\n'); let out = '', list = false;
  for(let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^\s*[-•*]\s+/.test(l)){ if(!list){ out+='<ul>'; list=true; } out += '<li>'+l.replace(/^\s*[-•*]\s+/,'')+'</li>'; continue; }
    if(list){ out+='</ul>'; list=false; }
    if(/^#{1,4}\s/.test(l)) out += '<h4>'+l.replace(/^#+\s/,'')+'</h4>';
    else if(l.trim()) out += '<p>'+l+'</p>';
  }
  if(list) out += '</ul>';
  return out;
}
function toast(msg){ const d = document.createElement('div'); d.textContent = msg; $('#toast').appendChild(d); setTimeout(()=>d.remove(), 2800); }
const posChip = p => p==='Pro' ? '<span class="chip pro">Pro</span>' : p==='Contra' ? '<span class="chip contra">Contra</span>' : p ? `<span class="chip">${esc(p)}</span>` : '';
const isMine = m => m && m.participated==='Ja';
const langChip = m => m && m.language ? `<span class="chip">${m.language==='Englisch'?'EN':'DE'}</span>` : '';
const sideChip = p => p==='Pro' ? '<span class="chip pro">Regierung</span>' : p==='Contra' ? '<span class="chip contra">Opposition</span>' : posChip(p);
const exChip = it => it && it.example ? '<span class="chip ex">Beispiel</span>' : '';
const get = (col,id) => S[col].find(x=>x.id===id);
function journalTitle(e){ const m = e.motionId && get('motions', e.motionId); return m ? m.title : (e.title || 'Debatte ohne verknüpfte Motion'); }
function itemTitle(col, it){
  if(!it) return '—';
  if(col==='journal') return journalTitle(it);
  if(col==='sessions') return (MODES[it.mode]?.name||'Training') + (it.motion ? ' · '+it.motion : '');
  if(col==='assessments') return 'Selbsteinschätzung ' + fmtDate(it.date);
  return it.title || it.text || '—';
}

/* =========================================================
   Datenspeicher (db-Capability, sonst localStorage)
   ========================================================= */
const S = Object.fromEntries(COLS.map(c=>[c,[]]));
const store = {mode:'init', db:null, loaded:new Set(), slow:false, queues:{}};
const LS_KEY = 'debate-hub:v1';

function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); COLS.forEach(c=>{ if(Array.isArray(d[c])) S[c]=d[c]; }); } }catch(e){}
  COLS.forEach(c=>store.loaded.add(c));
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast('Speichern im Browser nicht möglich.'); } }

async function initStore(){
  let db = null;
  if(window.claude && typeof window.claude.use === 'function'){
    try{ db = await window.claude.use('db'); }catch(e){ db = null; }
  }
  if(db){
    store.mode = 'db'; store.db = db;
    COLS.forEach(col=>{
      try{
        db.collection(col).onSnapshot(snap=>{
          S[col] = snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
          if(!snap.metadata.fromCache) store.loaded.add(col);
          scheduleRender();
        }, err=>{
          store.loaded.add(col); store.err = err && err.code;
          scheduleRender();
        });
      }catch(e){ store.loaded.add(col); }
    });
    setTimeout(()=>{ if(store.loaded.size < COLS.length){ store.slow = true; scheduleRender(); } }, 10000);
  } else {
    store.mode = 'local'; loadLocal();
  }
  scheduleRender();
}

function clean(o){ return JSON.parse(JSON.stringify(o)); }
async function save(col, item){
  const now = new Date().toISOString();
  item = Object.assign({}, item);
  if(!item.id) item.id = uid();
  if(!item.createdAt) item.createdAt = now;
  item.updatedAt = now;
  const idx = S[col].findIndex(x=>x.id===item.id);
  if(idx>=0) S[col][idx] = item; else S[col].push(item);
  if(store.mode === 'db'){
    const {id, ...body} = item;
    const key = col+'/'+id;
    const prev = store.queues[key] || Promise.resolve();
    const p = prev.catch(()=>{}).then(()=>store.db.collection(col).doc(id).set(clean(body)));
    store.queues[key] = p;
    p.catch(e=>toast(e && e.code==='quota_exceeded' ? 'Speicher voll: bitte alte Einträge löschen.' : 'Konnte nicht speichern ('+(e&&e.code||'Fehler')+').'));
  } else saveLocal();
  scheduleRender();
  return item;
}
async function remove(col, id){
  S[col] = S[col].filter(x=>x.id!==id);
  if(store.mode === 'db'){
    try{ await store.db.collection(col).doc(id).delete(); }catch(e){ toast('Löschen fehlgeschlagen.'); }
  } else saveLocal();
  scheduleRender();
}

function swap(root, html){
  const keep = {};
  root.querySelectorAll('[data-keep]').forEach(e=>{ if(e.id) keep[e.id] = e.value; });
  const a = document.activeElement; let fid = null, ss = null, se = null;
  if(a && root.contains(a) && a.id){ fid = a.id; try{ ss = a.selectionStart; se = a.selectionEnd; }catch(e){} }
  root.innerHTML = html;
  for(const id in keep){ const e = document.getElementById(id); if(e && e.hasAttribute('data-keep')) e.value = keep[id]; }
  if(fid){ const e = document.getElementById(fid); if(e){ e.focus({preventScroll:true}); try{ if(ss!=null) e.setSelectionRange(ss,se); }catch(x){} } }
}

/* ---------- Motion-Archiv ---------- */
function motionStatus(m){ return m.date && m.date>=today() ? 'Geplant' : 'Vergangen'; }
function vMotions(){
  const f = ui.mf, q = f.q.toLowerCase();
  let list = S.motions.filter(m=>{
    if(f.cat && m.category!==f.cat) return false;
    if(f.pos && m.position!==f.pos) return false;
    if(f.lang && m.language!==f.lang) return false;
    if(f.time==='past' && motionStatus(m)!=='Vergangen') return false;
    if(f.time==='future' && motionStatus(m)!=='Geplant') return false;
    if(q){ const hay = [m.title,m.definition,m.pro,m.contra,m.line,m.rebuttals,m.insights,m.improve,(m.tags||[]).join(' '),(m.notes||[]).map(n=>n.text).join(' ')].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const sorters = {'date-desc':byDateDesc, 'date-asc':(a,b)=>-byDateDesc(a,b), 'alpha':(a,b)=>a.title.localeCompare(b.title,'de'), 'cat':(a,b)=>(a.category||'').localeCompare(b.category||'','de') || byDateDesc(a,b)};
  list.sort(sorters[f.sort]||byDateDesc);
  const jc = id => S.journal.filter(j=>j.motionId===id).length;

    <div class="actions"><button class="btn primary" data-act="new" data-col="motions">Motion anlegen</button></div></header>
  ${loadingNote()}
  <div class="toolbar">
    <input type="search" id="mf_q" data-filter="mf.q" value="${esc(f.q)}" placeholder="Motion, Argument, Erkenntnis suchen …" aria-label="Suchen">
    <select id="mf_cat" data-filter="mf.cat" aria-label="Themengebiet"><option value="">Alle Themengebiete</option>${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select id="mf_lang" data-filter="mf.lang" aria-label="Sprache"><option value="">Deutsch & Englisch</option><option ${f.lang==='Deutsch'?'selected':''}>Deutsch</option><option ${f.lang==='Englisch'?'selected':''}>Englisch</option></select>
    <select id="mf_pos" data-filter="mf.pos" aria-label="Position"><option value="">Pro & Contra</option><option ${f.pos==='Pro'?'selected':''}>Pro</option><option ${f.pos==='Contra'?'selected':''}>Contra</option><option ${f.pos==='Offen'?'selected':''}>Offen</option></select>
    <div class="seg" role="group" aria-label="Zeitraum">${[['all','Alle'],['past','Vergangen'],['future','Geplant']].map(([k,l])=>`<button data-act="setf" data-f="mf.time" data-v="${k}" class="${f.time===k?'on':''}">${l}</button>`).join('')}</div>

  </div>
  <section class="panel"><div class="panel-h"><span class="eyebrow">${list.length} von ${S.motions.length} Motions</span></div>${body}</section>`;
}

    <div class="meta-line"><span class="mono">${fmtDate(e.date)}</span>${posChip(e.position)}${e.result&&e.result!=='—'?`<span class="chip">${esc(e.result)}</span>`:''}${exChip(e)}</div>
    <h4>${esc(journalTitle(e))}</h4>

  : `<section class="panel"><p class="empty">${S.args.length ? 'Kein Eintrag passt zu diesen Filtern.' : '<b>Die Bibliothek ist leer.</b> Sichere hier jedes Argument, das in einer Debatte funktioniert hat, und jeden Beleg, den du wiederverwenden willst.'}</p></section>`}`;

/* ---------- Fortschritt ---------- */
function skillPoints(){
  const pts = [];
  const has = r => r && Object.values(r).some(v=>+v>0);
  S.journal.forEach(e=>{ if(has(e.ratings)) pts.push({date:e.date||dayOf(e.createdAt), scores:e.ratings, src:'Journal', col:'journal', id:e.id, label:journalTitle(e), example:e.example}); });
  S.assessments.forEach(a=>{ if(has(a.ratings)) pts.push({date:a.date||dayOf(a.createdAt), scores:a.ratings, src:'Selbsteinschätzung', col:'assessments', id:a.id, label:a.note||'', example:a.example}); });
  S.sessions.forEach(s=>{ if(s.feedback && has(s.feedback.scores)) pts.push({date:s.date||dayOf(s.createdAt), scores:s.feedback.scores, src:'KI-Trainer', col:'sessions', id:s.id, label:itemTitle('sessions',s), example:s.example}); });
  return pts.sort((a,b)=>a.date.localeCompare(b.date));
}
function skillStats(){
  const pts = skillPoints();
  return SKILLS.map(([k,label],i)=>{
    const vals = pts.filter(p=>+p.scores[k]>0).map(p=>({date:p.date, v:+p.scores[k]}));
    const last5 = vals.slice(-5).map(x=>x.v), prev5 = vals.slice(-10,-5).map(x=>x.v);
    const recent = avg(last5), prev = avg(prev5);
    return {k, label, i, vals, all:avg(vals.map(x=>x.v)), recent, prev, trend: recent!=null&&prev!=null ? recent-prev : null};
  });
}
function chartSvg(stats){
  const W = 760, H = 270, L = 34, R = 18, T = 14, B = 30;
  const shown = stats.filter(s=>ui.pf.on.has(s.k) && s.vals.length);
  const dates = [...new Set(shown.flatMap(s=>s.vals.map(v=>v.date)))].sort();
  if(!dates.length) return '<p class="empty">Noch keine Bewertungen. Bewerte dich im Journal, per Selbsteinschätzung oder lass den KI-Trainer bewerten.</p>';
  const t0 = new Date(dates[0]+'T12:00').getTime(), t1 = new Date(dates[dates.length-1]+'T12:00').getTime();
  const x = d => { const t = new Date(d+'T12:00').getTime(); return t1===t0 ? L+(W-L-R)/2 : L + (t-t0)/(t1-t0)*(W-L-R); };
  const y = v => T + (10-v)/10*(H-T-B);
  let g = '';
  for(let v=0; v<=10; v+=2) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  const ticks = dates.length<=4 ? dates : [dates[0], dates[Math.floor(dates.length/3)], dates[Math.floor(2*dates.length/3)], dates[dates.length-1]];
  [...new Set(ticks)].forEach((d,i,arr)=>{ const anchor = arr.length===1 ? 'middle' : i===0 ? 'start' : i===arr.length-1 ? 'end' : 'middle'; g += `<text x="${x(d)}" y="${H-8}" text-anchor="${anchor}">${fmtShort(d)}</text>`; });
  shown.forEach(s=>{
    const c = `var(--s${s.i+1})`;
    const pts = s.vals.map(v=>[x(v.date), y(v.v), v]);
    if(pts.length>1) g += `<polyline style="fill:none;stroke:${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach((p,j)=>{ const last = j===pts.length-1; g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.5:3}" style="fill:${last?c:'var(--panel)'};stroke:${c}" stroke-width="2"><title>${esc(s.label)}: ${p[2].v} (${fmtDate(p[2].date)})</title></circle>`; });
  });
  return `<div class="chart-wrap chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kompetenzverlauf über die Zeit">${g}</svg></div>`;
}
function spark(vals){
  if(vals.length<2) return '<span class="faint">—</span>';
  const w = 90, h = 22, n = vals.length;
  const p = vals.map((v,i)=>[(i/(n-1))*(w-4)+2, h-2-(v.v/10)*(h-4)]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline style="fill:none;stroke:var(--brass)" stroke-width="1.5" points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/><circle cx="${p[n-1][0]}" cy="${p[n-1][1]}" r="2.5" style="fill:var(--brass)"/></svg>`;
}
function vProgress(){
  const stats = skillStats(), pts = skillPoints();
  const allC = {}, recC = {};
  const recentJ = [...S.journal].sort(byDateDesc).slice(0,5);
  S.journal.forEach(e=>(e.weaknesses||[]).forEach(t=>allC[t]=(allC[t]||0)+1));
  recentJ.forEach(e=>(e.weaknesses||[]).forEach(t=>recC[t]=(recC[t]||0)+1));
  const wl = Object.entries(allC).sort((a,b)=>b[1]-a[1]);
  const maxW = wl.length ? wl[0][1] : 1;
  const an = ui.analysis;
  return `
  <header class="head"><div><div class="eyebrow">Modul E</div><h2>Fortschritt</h2><p>Sieben Kompetenzen aus Journal, Selbsteinschätzungen und KI-Bewertungen. Skala 1–10; 7 entspricht solider Clubleistung.</p></div>
    <div class="actions"><button class="btn" data-act="analyze">Muster erkennen (KI)</button><button class="btn primary" data-act="new" data-col="assessments">Selbsteinschätzung</button></div></header>
  ${loadingNote()}
  ${an ? `<section class="fb"><div class="panel-h"><h3>Analyse deiner Muster</h3><button class="mini" data-act="closeanalysis">schließen</button></div>${an.loading?'<p class="muted">Die KI liest deine Reflexionen …</p>':an.error?`<p>${esc(an.error)}</p>`:`<div class="prose">${md(an.text)}</div>`}</section>` : ''}
  <section class="panel">
    <div class="panel-h"><h3>Verlauf</h3><span class="mono faint">${pts.length} Bewertungen</span></div>
    <div class="legend">${stats.map(s=>`<button class="chip ${ui.pf.on.has(s.k)?'on':''}" data-act="toggleskill" data-k="${s.k}"><i style="background:var(--s${s.i+1})"></i>${s.label}</button>`).join('')}</div>
    ${chartSvg(stats)}
  </section>
  <section class="panel">
    <div class="panel-h"><h3>Kompetenzen im Überblick</h3></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kompetenz</th><th class="num">Ø gesamt</th><th class="num">Ø letzte 5</th><th class="num">Trend</th><th class="num">Bewertungen</th><th>Verlauf</th></tr></thead><tbody>
    ${stats.map(s=>{ const tr = s.trend; const cls = tr==null?'flat':tr>0.2?'up':tr<-0.2?'down':'flat'; const sym = tr==null?'—':(tr>0?'▲ +':tr<0?'▼ ':'● ')+fmt1(tr); return `<tr><td>${s.label}</td><td class="num">${fmt1(s.all)}</td><td class="num">${fmt1(s.recent)}</td><td class="num ${cls}">${sym}</td><td class="num">${s.vals.length}</td><td>${spark(s.vals)}</td></tr>`; }).join('')}
    </tbody></table></div>
  </section>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h3>Wiederkehrende Schwächen</h3><span class="eyebrow">alle Debatten · letzte 5</span></div>
      ${wl.length ? `<div class="hbars">${wl.map(([t,n])=>{ const r = recC[t]||0; return `<div class="hbar"><span>${esc(t)}</span><span class="track"><i class="${r>=2?'hi':''}" style="width:${(n/maxW*100).toFixed(0)}%"></i></span><span class="mono">${n}${r?`·${r}`:''}</span></div>`; }).join('')}</div><p class="faint" style="font-size:12px">Rot: in mindestens zwei der letzten fünf Debatten aufgetreten.</p>` : '<p class="empty">Markiere im Journal beobachtete Schwächen, um Muster zu sehen.</p>'}
    </section>
    <section class="panel">
      <div class="panel-h"><h3>Alle Bewertungen</h3></div>
      ${pts.length ? `<div class="tbl-wrap"><table class="tbl timeline-tbl" style="min-width:420px"><thead><tr><th>Datum</th><th>Quelle</th><th class="num">Ø</th><th></th></tr></thead><tbody>${[...pts].reverse().map(p=>`<tr><td class="mono">${fmtShort(p.date)}</td><td>${esc(p.src)} ${p.example?'<span class="chip ex">Beispiel</span>':''}<div class="faint" style="font-size:12px">${esc(clip(p.label,60))}</div></td><td class="num">${fmt1(ratingAvg(p.scores))}</td><td><button class="mini" data-act="open" data-col="${p.col}" data-id="${p.id}">öffnen</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Noch keine Bewertungen.</p>'}
    </section>
  </div>`;
}

/* ---------- Wissen ---------- */
function vKnowledge(){
  const q = ui.kb.q.toLowerCase().trim();
  const strip = s => s.replace(/<[^>]+>/g,' ');
  const blockText = b => (b.h+' '+(b.b?strip(b.b):'')+' '+(b.dl?b.dl.flat().join(' '):'')).toLowerCase();
  const own = S.notes;
  const renderBlock = b => `<div class="kb-block"><h4>${esc(b.h)}</h4>${b.b?`<div class="prose">${b.b}</div>`:''}${b.dl?`<dl>${b.dl.filter(d=>!q||d.join(' ').toLowerCase().includes(q)||b.h.toLowerCase().includes(q)).map(([n,d,ex,ct])=>`<div><dt>${esc(n)}</dt><dd>${esc(d)}<br><em>Beispiel: ${esc(ex)}</em><br><span class="ctr">Konter: ${esc(ct)}</span></dd></div>`).join('')}</dl>`:''}</div>`;
  const ownHtml = secId => { const ns = own.filter(n=>(n.section||'inbox')===secId && (!q || (n.title+' '+n.body).toLowerCase().includes(q))).sort(byUpdated);
    return ns.map(n=>`<div class="note"><div class="meta-line"><strong style="color:var(--ink)">${esc(n.title||'Notiz')}</strong><span class="when">${fmtShort(dayOf(n.updatedAt))}</span>${exChip(n)}<button class="mini" data-act="edit" data-col="notes" data-id="${n.id}">bearbeiten</button></div><div class="prose">${md(n.body||'')}</div></div>`).join(''); };
  let body;
  if(q){
    const hits = KB.map(s=>({s, bl:s.blocks.filter(b=>blockText(b).includes(q))})).filter(x=>x.bl.length);
    const ownHits = own.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));
    body = (hits.length||ownHits.length) ? hits.map(x=>`<div class="eyebrow">${esc(x.s.title)}</div>${x.bl.map(renderBlock).join('')}`).join('') + (ownHits.length?`<div class="kb-own"><div class="eyebrow">Eigene Notizen</div>${[...new Set(ownHits.map(n=>n.section||'inbox'))].map(ownHtml).join('')}</div>`:'') : '<p class="empty">Nichts gefunden.</p>';
  } else {
    const secs = [...KB, {id:'inbox', title:'Eigene Notizen', blocks:[]}];
    const s = secs.find(x=>x.id===ui.kb.sec) || KB[0];
    body = `<h3 style="font-size:26px">${esc(s.title)}</h3>${s.blocks.map(renderBlock).join('')}
      <div class="kb-own"><div class="panel-h"><h3 style="font-size:17px">${s.id==='inbox'?'Schnellnotizen & eigene Einträge':'Eigene Ergänzungen'}</h3></div>
      ${ownHtml(s.id) || '<p class="empty">Ergänze hier eigene Formulierungen, Beispiele oder Beobachtungen aus Clubabenden.</p>'}
      <div class="kb-add"><input type="text" id="kbTitle" data-keep placeholder="Titel (optional)" aria-label="Titel"><textarea id="kbBody" data-keep rows="3" placeholder="Eigene Ergänzung …" aria-label="Ergänzung"></textarea><div><button class="btn" data-act="kbadd" data-sec="${s.id}">Ergänzung speichern</button></div></div></div>`;
  }
  const inboxN = own.filter(n=>(n.section||'inbox')==='inbox').length;
  return `
  <header class="head"><div><div class="eyebrow">Modul F</div><h2>Wissen & Frameworks</h2><p>Dein Nachschlagewerk zu Redeaufbau, Modellen, Rhetorik, Fehlschlüssen und Strategien, mit eigenen Ergänzungen.</p></div></header>
  <div class="toolbar"><input type="search" id="kb_q" data-filter="kb.q" value="${esc(ui.kb.q)}" placeholder="Im Nachschlagewerk suchen …" aria-label="Im Nachschlagewerk suchen"></div>
  <div class="kb">
    <nav class="toc" aria-label="Kapitel">${KB.map(s=>`<button class="${!q&&ui.kb.sec===s.id?'on':''}" data-act="kbsec" data-sec="${s.id}">${esc(s.title)}</button>`).join('')}<button class="${!q&&ui.kb.sec==='inbox'?'on':''}" data-act="kbsec" data-sec="inbox">Eigene Notizen${inboxN?` · ${inboxN}`:''}</button></nav>
    <div class="kb-body">${body}</div>
  </div>`;
}

/* ---------- Globale Suche ---------- */
function vSearch(){
  const q = ui.gq.toLowerCase().trim();
  const hits = [];
  if(q) ['motions','journal','args','notes','sessions'].forEach(c=>S[c].forEach(x=>{ const hay = JSON.stringify(x).toLowerCase(); if(hay.includes(q)) hits.push([c,x]); }));
  return `<header class="head"><div><div class="eyebrow">Suche</div><h2>„${esc(ui.gq)}“</h2><p>${hits.length} Treffer in Motions, Journal, Argumenten, Notizen und Trainings.</p></div></header>
  <section class="panel">${hits.length ? `<div class="rows">${hits.map(([c,x])=>`<button class="row" data-act="open" data-col="${c}" data-id="${x.id}"><span class="d">${fmtShort(x.date||dayOf(x.updatedAt))}</span><span class="t">${esc(clip(itemTitle(c,x),110))}</span><span class="m"><span class="chip">${COL_NAME[c]}</span>${exChip(x)}</span></button>`).join('')}</div>` : '<p class="empty">Keine Treffer.</p>'}</section>`;
}

function fieldHtml(f, v, draft){
  const id = 'f_'+f.k;
  const lab = `<label for="${id}">${esc(f.l)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</label>`;
  switch(f.t){
    case 'text': return `<div class="fld">${lab}<input id="${id}" type="text" value="${esc(v)}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}" ${f.list?`list="${f.list}"`:''}></div>`;
    case 'date': return `<div class="fld">${lab}<input id="${id}" type="date" value="${esc(v)}"></div>`;
    case 'select': return `<div class="fld">${lab}<select id="${id}">${f.opts.map(o=>`<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(f.labels?f.labels[o]:(o===''?'— wählen —':o))}</option>`).join('')}</select></div>`;
    case 'area': return `<div class="fld"><div class="lab"><label for="${id}">${esc(f.l)}${f.hint?` <span class="hint">· ${esc(f.hint)}</span>`:''}</label>${f.lib?`<button type="button" class="mini" data-act="libpick" data-k="${f.k}">+ aus Bibliothek</button>`:''}</div>${f.lib?`<div class="picker" id="pick_${f.k}" hidden></div>`:''}<textarea id="${id}" rows="${f.rows||4}">${esc(v)}</textarea></div>`;
    case 'tags': {
      const cur = v || [];
      const all = [...new Set([...(f.opts||[]), ...cur])];
      return `<div class="fld"><span class="lab">${esc(f.l)}</span><div class="chips" data-tagk="${f.k}">${all.map(t=>`<button type="button" class="chip ${cur.includes(t)?'on':''}" data-act="tagtoggle" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <div class="inline-add"><input type="text" id="tagin_${f.k}" placeholder="Eigenes hinzufügen und Enter drücken" data-tagadd="${f.k}" aria-label="Eigenes Schlagwort"></div></div>`;
    }
    case 'links': {
      const cur = v || [];
      const args = [...S.args].sort((a,b)=>a.title.localeCompare(b.title,'de'));
      return `<div class="fld"><span class="lab">${esc(f.l)} <span class="hint">${cur.length} gewählt</span></span>${args.length ? `<div class="linklist">${args.map(a=>`<label><input type="checkbox" name="${id}" value="${a.id}" ${cur.includes(a.id)?'checked':''}> <span>${esc(a.title)} <span class="faint">· ${esc(a.category||'')}</span></span></label>`).join('')}</div>` : '<p class="empty">Noch keine Einträge in der Bibliothek.</p>'}</div>`;
    }
    case 'ratings': {
      const r = v || {};
      return `<div class="fld"><span class="lab">${esc(f.l)}<span class="hint">0 = nicht bewertet</span></span><div class="sliders">${SKILLS.map(([k,l])=>`<div class="slider"><label for="${id}_${k}">${l}</label><input type="range" id="${id}_${k}" min="0" max="10" step="1" value="${+r[k]||0}" data-out="${id}_${k}_o"><output id="${id}_${k}_o">${+r[k]||'–'}</output></div>`).join('')}</div></div>`;
    }
    case 'motion': {
      const ms = [...S.motions].sort(byDateDesc);
      const pre = draft && draft.newMotion;
      return `<div class="fld">${lab}<select id="${id}"><option value="">— keine Motion verknüpfen —</option><option value="__new" ${pre?'selected':''}>+ Neue Motion anlegen …</option>${ms.map(m=>`<option value="${m.id}" ${v===m.id?'selected':''}>${esc(clip(m.title,80))} (${fmtShort(m.date)})</option>`).join('')}</select>
        <input type="text" id="f_newMotion" placeholder="Wortlaut der neuen Motion" ${pre?'':'hidden'} value="${esc(pre||'')}" aria-label="Wortlaut der neuen Motion"></div>`;
    }
  }
  return '';
}
function formHtml(col, item, draft){
  const sch = SCHEMA[col];
  return sch.map(f=>f.row ? `<div class="frow">${f.row.map(g=>fieldHtml(g, item[g.k], draft)).join('')}</div>` : fieldHtml(f, item[f.k], draft)).join('');
}
function collect(col){
  const o = {};
  for(const f of flat(SCHEMA[col])){
    const id = 'f_'+f.k;
    if(f.t==='tags') o[f.k] = [...document.querySelectorAll(`[data-tagk="${f.k}"] .chip.on`)].map(c=>c.dataset.v);
    else if(f.t==='links') o[f.k] = [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(c=>c.value);
    else if(f.t==='ratings'){ o[f.k] = {}; SKILLS.forEach(([k])=>{ o[f.k][k] = +document.getElementById(id+'_'+k).value || 0; }); }
    else { const el = document.getElementById(id); o[f.k] = el ? el.value.trim() : ''; }
  }
  if(o.strength) o.strength = +o.strength;
  return o;
}

const ERR = {not_granted:'Du hast dem Trainer den Zugriff auf Claude nicht erlaubt. Öffne die Berechtigungen der Seite, um ihn zu aktivieren.', sampling_disabled:'Claude ist für dieses Konto hier nicht verfügbar.', rate_limited:'Gerade zu viele Anfragen. Versuche es in einer Minute erneut.', session_expired:'Bitte melde dich erneut an.', refused:'Claude hat diese Anfrage abgelehnt. Formuliere sie anders.', empty_completion:'Keine Antwort erhalten. Versuche es mit weniger Text.', prompt_too_large:'Der Verlauf ist zu lang. Starte eine neue Einheit.', invalid_json:'Die Bewertung kam unvollständig an. Bitte erneut anfordern.'};
const errMsg = e => ERR[e && e.code] || 'Verbindung unterbrochen. Bitte erneut versuchen.';

function opp(){ return T.side==='Pro' ? 'Contra' : 'Pro'; }
function weakContext(){
  const w = weaknessReport();
  const items = [...w.tags.slice(0,3).map(x=>x.t), ...w.low.map(s=>s.label+' (Ø '+fmt1(s.recent)+')')];
  return items.length ? 'Meine bekannten Schwächen aus früheren Debatten: '+items.join('; ')+'. Achte besonders darauf und sprich sie an, wenn sie wieder auftreten.' : '';
}
function rulesText(){
  const m = T.motion;
  const modeRules = {
    duel:`Modus: Debatte gegen mich. Du vertrittst konsequent die Gegenseite (${opp()}). Halte echte, starke Reden mit zwei bis drei Argumenten (These, Mechanismus, Impact) und widerlege meine Punkte direkt und konkret. Gib in diesem Modus KEIN Coaching-Feedback, sondern debattiere. Beende jede Rede mit einer scharfen Zwischenfrage an mich. Reden etwa 300–400 Wörter.`,
    prep:`Modus: Vorbereitungs-Check. Ich habe 15 Minuten vorbereitet und schicke dir meinen Case für die Seite ${T.side}. Prüfe wie ein strenger Juror: Wo fehlen Mechanismen? Welche Gegenargumente habe ich übersehen? Welcher Clash entscheidet die Debatte? Was würde die Gegenseite zuerst angreifen? Stelle danach zwei bohrende Nachfragen.`,
    rebuttal:`Modus: Rebuttal-Drill. Präsentiere jeweils EIN starkes Argument der Gegenseite (${opp()}) mit Mechanismus und Beispiel (max. 120 Wörter). Ich widerlege. Bewerte meinen Rebuttal knapp: Welche Ebene habe ich angegriffen (nicht wahr / nicht kausal / nicht wichtig / nicht exklusiv / Turn)? Was hätte stärker gewirkt? Note 1–10. Bring dann sofort das nächste, schwierigere Argument.`,
    poi:`Modus: POI-Drill. Stelle mir jeweils EINE kurze, scharfe Zwischenfrage (max. 25 Wörter) gegen meine Seite (${T.side}). Ich antworte in ein bis zwei Sätzen. Bewerte jede Antwort in einer Zeile (Treffsicherheit, Ruhe, Rückführung auf mein Argument, Note 1–10) und stelle sofort die nächste, schwierigere Frage.`,
    check:`Modus: Argument-Check. Ich schicke dir ein einzelnes Argument. Analysiere: 1) Struktur (These, Mechanismus, Impact vorhanden?), 2) logische Lücken und Fehlschlüsse mit Namen, 3) den stärksten Angriff der Gegenseite, 4) wie ich das Argument härter mache, 5) Note 1–10. Sei streng.`,
    switch:`Modus: Seitenwechsel. Ich skizziere zuerst die stärkste Pro-Rede, danach die stärkste Contra-Rede. Nach der ersten Skizze: kurze Kritik und Aufforderung zur Gegenseite. Nach beiden: Welche Seite war stärker und warum? Wo habe ich Strohmänner gegen meine eigene Position gebaut? Welche Argumente fehlten auf der schwächeren Seite?`
  }[T.mode];
  return `Du bist mein persönlicher Debattiertrainer und Juror (Formate BPS und OPD, Debattierklub Wien). Antworte auf Deutsch.
Grundhaltung: kritisch, anspruchsvoll und fair. Stimme mir nicht zu, nur weil ich etwas behaupte. Benenne konkret unbelegte Behauptungen, fehlende Mechanismen, fehlende Impacts, logische Fehlschlüsse (mit Namen), fehlendes Weighing und übersehene Gegenargumente. Lob nur, wenn es verdient ist, und dann präzise.
Halte Antworten kompakt (höchstens etwa 250 Wörter, außer du hältst eine Rede). Kurze Absätze, Aufzählungen mit "- ", Hervorhebungen mit **fett**. Keine Floskeln.
${modeRules}
${m ? `Motion: "${m.title}"${m.context?'\nKontext/Info-Slide: '+m.context:''}` : 'Keine bestimmte Motion vorgegeben.'}
${m && (m.language==='Englisch' || /^(TH[WBR]?|THIS HOUSE|DH would)\b/i.test(m.title)) ? 'Dies ist eine englischsprachige Debatte: Halte Reden, Fragen und Bewertungen auf Englisch, gib Coaching-Hinweise aber zusätzlich kurz auf Deutsch.' : ''}
${T.mode==='check' ? '' : 'Meine Seite: '+T.side+'.'}
${weakContext()}`;
}
function kickoff(){
  return {duel: T.side==='Contra' ? 'Eröffne die Debatte mit deiner Rede für Pro.' : null, rebuttal:'Bring das erste Argument.', poi:'Erste Zwischenfrage bitte.'}[T.mode] || null;
}
function sysNote(){
  return {duel: T.side==='Pro' ? 'Du eröffnest. Schreib deine Rede (oder deine Stichpunkte) und schick sie ab.' : 'Die KI eröffnet für Pro.', prep:'Starte den 15-Minuten-Timer, bereite deinen Case vor und schick ihn dann ab.', check:'Füge dein Argument ein und schick es ab.', switch:'Schreib zuerst deine stärkste Pro-Skizze.', rebuttal:'', poi:''}[T.mode];
}

function afterTrainerRender(){ const c = $('#chat'); if(c && (T.busy || T.justSent)){ c.lastElementChild && c.lastElementChild.scrollIntoView({block:'nearest'}); T.justSent = false; } updateWc(); }

function setMotion(mo){ T.motion = mo; T.note = ''; render(); }
function resetTrainer(){ if(T.ctl) T.ctl.abort(); Object.assign(T, {turns:[], busy:false, ctl:null, feedback:null, fbBusy:false, sessionId:null, stream:'', note:''}); render(); }

async function callTrainer(){
  const sample = await getSample();
  if(!sample){ T.note = 'Der KI-Trainer ist in dieser Ansicht nicht verfügbar.'; render(); return; }
  T.busy = true; T.stream = ''; T.note = ''; T.ctl = new AbortController();
  render();
  const turns = T.turns.filter(t=>t.role!=='sys').slice(-24).map(t=>({role:t.role, content:t.content}));
  while(turns.length && turns[0].role!=='user') turns.shift();
  const input = [{role:'user', content:rulesText()}, ...turns];
  try{
    const res = await sample(input, {cache:false, signal:T.ctl.signal, onText:({text})=>{ T.stream = text; const el = document.querySelector('#streamMsg .prose'); if(el){ el.innerHTML = md(text); } }});
    T.turns.push({role:'assistant', content:res.text});
    if(res.truncated) T.note = 'Antwort wurde gekürzt.';
  }catch(e){
    if(e && e.text && e.code!=='refused') T.turns.push({role:'assistant', content:e.text});
    if(!(e && e.code==='cancelled')) T.note = errMsg(e);
    if(isGone(e)) sampleState = 'none';
  }
  T.busy = false; T.ctl = null; T.stream = ''; T.justSent = true;
  render();
}
async function trainerSend(){
  const i = $('#tInput'); if(!i) return;
  const text = i.value.trim(); if(!text || T.busy) return;
  if(MODES[T.mode].needsMotion && !T.motion){ toast('Bitte zuerst eine Motion wählen.'); return; }
  if(!T.turns.length){ const k = kickoff(); if(k && T.mode!=='duel') T.turns.push({role:'user', content:k, hidden:true}); }
  T.turns.push({role:'user', content:text});
  i.value = '';
  T.justSent = true;
  await callTrainer();
}
async function trainerStart(){
  const k = kickoff(); if(!k) return;
  T.turns.push({role:'user', content:k, hidden:true});
  await callTrainer();
}
async function trainerFeedback(){
  const sample = await getSample(); if(!sample) return;
  const transcript = T.turns.filter(t=>!t.hidden && t.role!=='sys').map(t=>(t.role==='user'?'ICH: ':'TRAINER/GEGNER: ')+t.content).join('\n\n').slice(-60000);
  if(!T.turns.some(t=>t.role==='user' && !t.hidden)){ toast('Schreib zuerst einen eigenen Beitrag.'); return; }
  T.fbBusy = true; render();
  const keys = SKILLS.map(s=>s[0]);
  const prompt = `Du bist ein strenger Debatten-Juror. Bewerte ausschließlich MEINE Beiträge (mit "ICH:" markiert) in diesem Trainingsverlauf.
Übungsform: ${MODES[T.mode].name}. ${T.motion?'Motion: "'+T.motion.title+'". ':''}${T.mode!=='check'?'Meine Seite: '+T.side+'.':''}
${weakContext()}

VERLAUF:
${transcript}

Antworte NUR mit einem JSON-Objekt in genau dieser Form:
{"summary":"2-3 Sätze Gesamturteil","strengths":["…"],"weaknesses":["…"],"fallacies":["Name des Fehlschlusses: wo genau"],"scores":{${keys.map(k=>`"${k}":0`).join(',')}},"tasks":["konkrete Übung für die nächste Woche"]}
Scores von 1 bis 10; 0 für Kompetenzen, die in diesem Verlauf nicht beurteilbar sind. Maßstab: 5 = Anfänger, 7 = solide Clubleistung, 9+ nur für Turnierniveau. Sei kritisch und konkret, höchstens je 4 Punkte pro Liste, Deutsch.`;
  try{
    const fb = await sample.json(prompt, {cache:false});
    const sc = {}; keys.forEach(k=>{ const v = Math.round(+((fb&&fb.scores)||{})[k]||0); sc[k] = Math.max(0, Math.min(10, v)); });
    const arr = a => Array.isArray(a) ? a.map(String).filter(Boolean).slice(0,6) : [];
    T.feedback = {summary:String(fb&&fb.summary||''), strengths:arr(fb&&fb.strengths), weaknesses:arr(fb&&fb.weaknesses), fallacies:arr(fb&&fb.fallacies), tasks:arr(fb&&fb.tasks), scores:sc};
  }catch(e){ T.note = errMsg(e); if(isGone(e)) sampleState = 'none'; }
  T.fbBusy = false; render();
}
async function trainerSave(){
  const prev = T.sessionId && get('sessions', T.sessionId);
  let turns = T.turns.filter(t=>t.role!=='sys');
  let total = 0; const kept = [];
  for(let i=turns.length-1;i>=0;i--){ total += turns[i].content.length; if(total>150000) break; kept.unshift(turns[i]); }
  const it = await save('sessions', Object.assign({}, prev||{}, {id:T.sessionId||undefined, date:prev?prev.date:today(), mode:T.mode, motion:T.motion?T.motion.title:'', motionId:T.motion&&T.motion.motionId||'', category:T.motion&&T.motion.category||'', side:T.mode==='check'?'':T.side, turns:kept, feedback:T.feedback||null}));
  T.sessionId = it.id; toast('Einheit gespeichert.'); render();
}

/* Timer */
function clockText(){ const s = Math.abs(TM.left); return (TM.left<0?'+':'')+Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function clockSub(){
  if(TM.left<=0) return 'Zeit ist um – Schlusssatz!';
  const el = TM.dur-TM.left;
  if(TM.dur===420){ if(el<60) return 'Geschützte Zeit · keine Zwischenfragen'; if(TM.left<=60) return 'Geschützte Zeit · Weighing & Schluss'; return 'Zwischenfragen erlaubt'; }
  if(TM.dur===900){ if(el<180) return 'Ideen sammeln'; if(el<480) return 'Clash & Linie festlegen'; if(el<780) return 'Argumente ausformulieren'; return 'Gegenargumente notieren'; }
  return '';
}
function tick(){
  const now = Date.now(); TM.left -= (now-TM.last)/1000; TM.last = now;
  const c = $('#clock'); if(c){ c.textContent = clockText(); c.className = 'clock'+(TM.left<=0?' over':TM.left<=30?' warn':''); }
  const b = $('#tbar'); if(b) b.style.width = Math.min(100,(1-Math.max(0,TM.left)/TM.dur)*100)+'%';
  const s = $('#clockSub'); if(s) s.textContent = clockSub();
}
function tmToggle(){
  TM.run = !TM.run;
  if(TM.run){ TM.last = Date.now(); TM.iv = setInterval(tick, 250); } else { clearInterval(TM.iv); tick(); }
  const g = $('#tmGo'); if(g) g.textContent = TM.run?'Pause':'Start';
}
function tmSet(s){ clearInterval(TM.iv); TM.run = false; TM.dur = s; TM.left = s; render(); }

    const r = await sample.json(`Formuliere eine anspruchsvolle, ausgewogene Debatten-Motion im Stil des Debattierklubs Wien (beginnt mit "DH" für "Dieses Haus") zum Themengebiet "${cat}". Beide Seiten müssen gut vertretbar sein. Vermeide diese bereits bekannten Motions: ${S.motions.slice(0,20).map(m=>m.title).join('; ')}.
Antworte NUR mit JSON: {"title":"DH …","context":"Info-Slide in 1-2 Sätzen, nur falls nötig, sonst leer"}`, {modelTier:'quick', cache:false});
    if(r && r.title) setMotion({title:String(r.title), context:String(r.context||''), category:cat, src:'KI-generiert'});
    else { T.note = 'Keine Motion erhalten.'; render(); }
  }catch(e){ T.note = errMsg(e); render(); }
}

/* =========================================================
   Export / Import
   ========================================================= */
async function doExport(){
  const payload = JSON.stringify({app:'personal-debate-hub', version:1, exported:new Date().toISOString(), data:S}, null, 2);
  let dl = null;
  try{ dl = window.claude && await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:'debate-hub-'+today()+'.json', data:payload}); toast('Sicherung erstellt.'); return; }catch(e){ if(e && e.code==='declined') return; }
  }
  openSheet({kind:'raw', html:`<div class="sheet-top"><div><div class="eyebrow">Sicherung</div><h2>Daten als JSON</h2></div><button class="btn ghost" data-act="close">Schließen</button></div><p class="muted">Kopiere den Inhalt und speichere ihn als .json-Datei. Über „Importieren“ lässt er sich wiederherstellen.</p><div class="fld"><textarea id="exportBox" rows="18" readonly>${esc(payload)}</textarea></div><div><button class="btn primary" data-act="copyexport">In die Zwischenablage</button></div>`});
}
function handleImport(file){
  const r = new FileReader();
  r.onload = () => {
    let d; try{ d = JSON.parse(r.result); d = d.data || d; }catch(e){ toast('Die Datei ist kein gültiges JSON.'); return; }
    const counts = COLS.map(c=>[c, Array.isArray(d[c]) ? d[c].filter(x=>x && typeof x==='object').length : 0]).filter(x=>x[1]);
    if(!counts.length){ toast('Keine passenden Einträge in der Datei gefunden.'); return; }
    ui.pendingImport = d;
    openSheet({kind:'raw', html:`<div class="sheet-top"><div><div class="eyebrow">Import</div><h2>Sicherung einspielen</h2></div><button class="btn ghost" data-act="close">Abbrechen</button></div>
      <div class="prose"><p>Gefunden:</p><ul>${counts.map(([c,n])=>`<li>${n} × ${COL_NAME[c]}</li>`).join('')}</ul><p>Einträge mit gleicher ID werden überschrieben, alle anderen bleiben erhalten.</p></div>
      <div><button class="btn primary" data-act="doimport">Importieren</button></div>`});
  };
  r.readAsText(file);
}
async function doImport(){
  const d = ui.pendingImport; if(!d) return;
  let n = 0;
  for(const c of COLS){ if(!Array.isArray(d[c])) continue; for(const x of d[c]){ if(x && typeof x==='object'){ await save(c, Object.assign({}, x, {id: (typeof x.id==='string' && /^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(x.id)) ? x.id : undefined})); n++; } } }
  ui.pendingImport = null; closeSheet(); toast(n+' Einträge importiert.');
}

/* =========================================================
   Events
   ========================================================= */
function go(r){ ui.route = r; if(location.hash !== '#'+r) history.replaceState(null,'','#'+r); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', ()=>{ const r = parseHash(); if(r!==ui.route){ ui.route = r; render(); window.scrollTo(0,0); } });

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, col = el.dataset.col, id = el.dataset.id;
  if(el.tagName==='INPUT' && el.type==='checkbox' && a!=='toggle') return;
  switch(a){
    case 'go': if(ui.sheet) closeSheet(); go(el.dataset.r); break;
    case 'new': openSheet({kind:'edit', col, id:null, preset: col==='journal'||col==='assessments' ? {date:today()} : col==='motions' ? {date:today(), position:'Pro', language:'Deutsch', participated:'Ja'} : col==='args' ? {strength:3} : {}}); break;
    case 'edit': openSheet({kind:'edit', col, id}); break;
    case 'open': openSheet({kind:'detail', col, id}); break;
    case 'close': closeSheet(); break;
    case 'bgclose': if(ui.sheet && ui.sheet.kind!=='edit') closeSheet(); break;
    case 'del':
      if(!el.dataset.armed){ el.dataset.armed = '1'; el.textContent = 'Wirklich löschen?'; setTimeout(()=>{ if(el.isConnected){ delete el.dataset.armed; el.textContent = 'Löschen'; } }, 4000); }
      else { await remove(col, id); closeSheet(); toast(COL_NAME[col]+' gelöscht.'); }
      break;
    case 'delq': remove(col, id); break;
    case 'toggle': { const it = get(col,id); if(it) save(col, Object.assign({}, it, {done: el.checked})); break; }
    case 'addgoal': { const i = $('#goalIn'); const t = i.value.trim(); if(!t) { i.focus(); break; } i.value = ''; save('goals', {text:t, skill:$('#goalSkill').value, done:false}); break; }
    case 'addtask': { const i = $('#taskIn'); const t = i.value.trim(); if(!t) { i.focus(); break; } i.value = ''; save('tasks', {text:t, due:$('#taskDue').value, done:false, source:'manuell'}); break; }
    case 'qnote': { const i = $('#qnote'); const t = i.value.trim(); if(!t) break; i.value = ''; save('notes', {section:'inbox', title:clip(t,50), body:t}); toast('Notiz abgelegt.'); break; }
    case 'suggest': suggestTasks(); break;
    case 'takesug': { const s = ui.suggestions.items[+el.dataset.i]; if(s){ save('tasks', {text:s.text, done:false, source:'KI-Vorschlag', skill:s.skill}); ui.suggestions.items.splice(+el.dataset.i,1); if(!ui.suggestions.items.length) ui.suggestions = null; render(); } break; }
    case 'clearex': {
      if(!el.dataset.armed){ el.dataset.armed='1'; el.textContent='Alle Beispiele wirklich löschen?'; setTimeout(()=>{ if(el.isConnected){ delete el.dataset.armed; el.textContent='Beispieldaten entfernen'; } },4000); break; }
      for(const c of COLS) for(const x of S[c].filter(x=>x.example)) await remove(c, x.id);
      toast('Beispieldaten entfernt.'); break;
    }
    case 'setf': { const [o,k] = el.dataset.f.split('.'); ui[o][k] = el.dataset.v; render(); break; }
    case 'addnote': {
      const i = document.getElementById('noteIn_'+id); const t = i && i.value.trim(); if(!t) break;
      const it = get(col,id); if(!it) break; i.value = '';
      await save(col, Object.assign({}, it, {notes:[...(it.notes||[]), {t:new Date().toISOString(), text:t}]}));
      toast('Nachtrag gespeichert.'); break;
    }
    case 'reflect': openSheet({kind:'edit', col:'journal', id:null, preset:{motionId:id, date:get('motions',id)?.date||today(), position:get('motions',id)?.position==='Contra'?'Contra':'Pro', role:get('motions',id)?.role||''}}); break;
    case 'trainmotion': { const m = get('motions',id); if(!m) break; closeSheet(); resetTrainer(); T.motion = {title:m.title, context:m.definition?clip(m.definition,400):'', category:m.category, language:m.language||'', src:'Archiv', motionId:m.id}; if(m.position==='Pro'||m.position==='Contra') T.side = m.position; go('trainer'); break; }
    case 'trainarg': { const ar = get('args',id); if(!ar) break; closeSheet(); resetTrainer(); T.mode = 'check'; go('trainer'); setTimeout(()=>{ const i = $('#tInput'); if(i){ i.value = [ar.title, ar.claim&&'These: '+ar.claim, ar.reasoning&&'Mechanismus: '+ar.reasoning, ar.evidence&&'Beleg: '+ar.evidence, ar.impact&&'Impact: '+ar.impact].filter(Boolean).join('\n'); updateWc(); i.focus(); } }, 50); break; }
    case 'resume': { const s = get('sessions',id); if(!s) break; closeSheet(); if(T.ctl) T.ctl.abort(); Object.assign(T, {mode:s.mode||'duel', side:s.side||'Pro', motion:s.motion?{title:s.motion, category:s.category||'', src:'Fortgesetzt', motionId:s.motionId||''}:null, turns:(s.turns||[]).slice(), feedback:s.feedback||null, sessionId:s.id, busy:false, note:''}); go('trainer'); break; }
    case 'toggleskill': { const k = el.dataset.k; ui.pf.on.has(k) ? ui.pf.on.delete(k) : ui.pf.on.add(k); render(); break; }
    case 'analyze': analyzePatterns(); break;
    case 'closeanalysis': ui.analysis = null; render(); break;
    case 'kbsec': ui.kb.sec = el.dataset.sec; ui.kb.q = ''; render(); break;
    case 'kbadd': { const b = $('#kbBody'), t = $('#kbTitle'); const body = b.value.trim(); if(!body){ b.focus(); break; } const title = t.value.trim(); b.value = ''; t.value = ''; save('notes', {section:el.dataset.sec, title:title||clip(body,50), body}); toast('Ergänzung gespeichert.'); break; }
    case 'export': doExport(); break;
    case 'import': $('#importFile').click(); break;
    case 'doimport': doImport(); break;
    case 'copyexport': { const b = $('#exportBox'); try{ await navigator.clipboard.writeText(b.value); toast('Kopiert.'); }catch(e){ b.focus(); b.select(); toast('Text markiert – jetzt kopieren.'); } break; }
    // Editor helpers
    case 'tagtoggle': el.classList.toggle('on'); break;
    case 'libpick': {
      const p = document.getElementById('pick_'+el.dataset.k); if(!p) break;
      if(!p.hidden){ p.hidden = true; break; }
      const args = [...S.args].sort(byUpdated);
      p.innerHTML = args.length ? `<input type="search" class="pick-q" placeholder="Bibliothek filtern …" aria-label="Bibliothek filtern">${args.map(x=>`<button type="button" data-act="libins" data-k="${el.dataset.k}" data-id="${x.id}" data-s="${esc((x.title+' '+(x.claim||'')+' '+(x.category||'')).toLowerCase())}"><strong>${esc(x.title)}</strong> <span class="faint">· ${esc(x.type||'')} · ${esc(x.category||'')}</span></button>`).join('')}` : '<p class="empty">Die Bibliothek ist noch leer.</p>';
      p.hidden = false; const q = p.querySelector('input'); if(q) q.focus(); break;
    }
    case 'libins': {
      const ar = get('args',id), ta = document.getElementById('f_'+el.dataset.k); if(!ar||!ta) break;
      const line = '- **'+ar.title+'**'+(ar.claim?': '+ar.claim:'')+(ar.evidence?' (Beleg: '+clip(ar.evidence,160)+')':'');
      ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/,'')+'\n' : '') + line;
      const cb = document.querySelector(`input[name="f_argIds"][value="${id}"]`); if(cb) cb.checked = true;
      document.getElementById('pick_'+el.dataset.k).hidden = true; toast('Eingefügt und verknüpft.'); break;
    }
    // Trainer
    case 'tmode': if(!T.turns.length){ T.mode = el.dataset.m; T.feedback = null; T.note=''; if(T.mode==='prep') tmSet(900); else render(); } break;
    case 'tside': { const s = el.dataset.s; T.side = s==='rand' ? (Math.random()<.5?'Pro':'Contra') : s; render(); break; }
    case 'trandom': { T.cat = $('#tCat').value; const pool = PRACTICE.filter(p=>!T.cat || p[0]===T.cat); const p = pool[Math.floor(Math.random()*pool.length)]; setMotion({title:p[1], category:p[0], src:'Übungsmotion', context:''}); break; }
    case 'tgen': T.cat = $('#tCat').value; generateMotion(); break;
    case 'town': { const i = $('#tOwn'); const t = i.value.trim(); if(!t){ i.focus(); break; } i.value=''; setMotion({title:t, category:'', src:'Eigene', context:''}); break; }
    case 'tarchive': { if(!T.motion) break; const it = await save('motions', {title:T.motion.title, category:T.motion.category||'', definition:T.motion.context||'', date:today(), position:T.side, language:T.motion.language||'', participated:'Nein', insights:'', tags:['Training']}); T.motion.motionId = it.id; T.motion.src = 'Archiv'; toast('Motion ins Archiv übernommen.'); render(); break; }
    case 'tstart': trainerStart(); break;
    case 'tsend': trainerSend(); break;
    case 'tstop': if(T.ctl) T.ctl.abort(); break;
    case 'tnew': resetTrainer(); break;
    case 'tfeedback': trainerFeedback(); break;
    case 'tsave': trainerSave(); break;
    case 'ttasks': { (T.feedback.tasks||[]).forEach(t=>save('tasks', {text:t, done:false, source:'KI-Trainer'})); toast('Aufgaben übernommen.'); break; }
    case 'tmgo': tmToggle(); break;
    case 'tmreset': tmSet(TM.dur); break;
    case 'tmset': tmSet(+el.dataset.s); break;
  }
});

document.addEventListener('submit', async ev => {
  const form = ev.target; if(form.id!=='edForm') return;
  ev.preventDefault();
  const s = ui.sheet; if(!s) return;
  const col = form.dataset.col;
  const data = collect(col);
  const reqF = flat(SCHEMA[col]).find(f=>f.req && !data[f.k]);
  if(reqF){ const e = document.getElementById('f_'+reqF.k); e.focus(); e.style.borderColor='var(--bad)'; toast(reqF.l+' fehlt.'); return; }
  if(col==='journal' && data.motionId==='__new'){
    const t = ($('#f_newMotion').value||'').trim();
    if(!t){ $('#f_newMotion').focus(); toast('Bitte den Wortlaut der neuen Motion eingeben.'); return; }
    const m = await save('motions', {title:t, date:data.date, position:data.position, role:data.role, participated:'Ja', category:''});
    data.motionId = m.id;
  }
  if(col==='assessments') data.source = 'Selbsteinschätzung';
  const base = s.id ? (get(col, s.id) || {}) : {};
  const it = await save(col, Object.assign({}, base, data, {id:s.id||undefined}));
  toast(COL_NAME[col]+' gespeichert.');
  if(col==='notes') closeSheet(); else openSheet({kind:'detail', col, id:it.id});
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.dataset.filter){ const [o,k] = el.dataset.filter.split('.'); ui[o][k] = el.value; render(); return; }
  if(el.id==='gsearch'){ ui.gq = el.value; if(ui.gq.trim()){ if(ui.route!=='search'){ ui.route='search'; history.replaceState(null,'','#search'); } } else if(ui.route==='search'){ ui.route='dashboard'; history.replaceState(null,'','#dashboard'); } render(); return; }
  if(el.type==='range' && el.dataset.out){ const o = document.getElementById(el.dataset.out); if(o) o.textContent = +el.value || '–'; return; }
  if(el.classList.contains('pick-q')){ const q = el.value.toLowerCase(); el.parentElement.querySelectorAll('button[data-s]').forEach(b=>b.hidden = !b.dataset.s.includes(q)); return; }
  if(el.id==='tInput') updateWc();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.id==='f_motionId'){ const n = $('#f_newMotion'); if(n){ n.hidden = el.value!=='__new'; if(!n.hidden) n.focus(); } const m = get('motions', el.value); if(m && !ui.sheet.id){ const p = $('#f_position'); if(p && (m.position==='Pro'||m.position==='Contra')) p.value = m.position; const r = $('#f_role'); if(r && !r.value && m.role) r.value = m.role; } }
  if(el.id==='tArch' && el.value){ const m = get('motions', el.value); if(m){ T.motion = {title:m.title, context:m.definition?clip(m.definition,400):'', category:m.category, language:m.language||'', src:'Archiv', motionId:m.id}; if(m.position==='Pro'||m.position==='Contra') T.side = m.position; T.note=''; render(); } }
  if(el.id==='tCat') T.cat = el.value;
  if(el.id==='importFile' && el.files && el.files[0]){ handleImport(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if(ev.key==='Escape' && ui.sheet){ const p = el.closest && el.closest('.picker'); if(p){ p.hidden = true; return; } if(ui.sheet.kind!=='edit') closeSheet(); return; }
  if(ev.key==='Enter' && el.dataset && el.dataset.tagadd){
    ev.preventDefault(); const v = el.value.trim(); if(!v) return;
    const box = document.querySelector(`[data-tagk="${el.dataset.tagadd}"]`);
    let ex = [...box.querySelectorAll('.chip')].find(c=>c.dataset.v.toLowerCase()===v.toLowerCase());
    if(!ex){ ex = document.createElement('button'); ex.type='button'; ex.className='chip'; ex.dataset.act='tagtoggle'; ex.dataset.v=v; ex.textContent=v; box.appendChild(ex); }
    ex.classList.add('on'); el.value = ''; return;
  }
  if((ev.key==='Enter'||ev.key===' ') && el.getAttribute && el.getAttribute('role')==='button'){ ev.preventDefault(); el.click(); return; }
  if(ev.key==='Enter' && (ev.metaKey||ev.ctrlKey) && el.id==='tInput'){ ev.preventDefault(); trainerSend(); }
  if(ev.key==='Enter' && ['goalIn','taskIn','tOwn'].includes(el.id)){ ev.preventDefault(); document.querySelector({goalIn:'[data-act=addgoal]',taskIn:'[data-act=addtask]',tOwn:'[data-act=town]'}[el.id]).click(); }
});

/* Start */
ui.route = parseHash();
render();
initStore();
getSample().then(()=>{ if(ui.route==='trainer') render(); });
})();
</script>
